*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;color:#e8e8e8;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,var(--page1),var(--page2) 70%)}
#app{width:100%;max-width:380px;min-height:100vh;min-height:100dvh;padding:56px 14px 16px;position:relative;display:flex;flex-direction:column}
#antenna{position:absolute;top:6px;left:44px;width:24px;height:70px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,var(--ant1),var(--ant2) 45%,var(--ant1));box-shadow:0 2px 6px rgba(0,0,0,.6)}
#body{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px 18px;border-radius:34px 34px 46px 46px;background:linear-gradient(160deg,var(--body1),var(--body2) 55%,var(--body3));border:2px solid var(--edge);box-shadow:inset 0 2px 0 var(--hi),0 18px 40px rgba(0,0,0,.65)}
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
#brand{font-size:14px;letter-spacing:6px;color:var(--brand);font-weight:800}
#skinbtn{margin-left:auto;border:none;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--modetx);background:var(--well);box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
#txled{width:14px;height:14px;border-radius:50%;background:var(--ledoff);box-shadow:inset 0 0 3px #000}
body:has(#ptt.talk) #txled{background:var(--ledon);box-shadow:0 0 12px 3px var(--ledon)}
#speaker{height:48px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--grille-a) 0 6px,var(--grille-b) 6px 9px);box-shadow:inset 0 3px 8px rgba(0,0,0,.85)}
#lcd{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:12px;border:3px solid var(--edge);background:linear-gradient(var(--lcd1),var(--lcd2));color:var(--lcdtx);font-family:"Courier New",monospace;box-shadow:inset 0 0 14px rgba(0,0,0,.35),var(--lcdglow)}
#lcd .lbl{font-size:12px;font-weight:700;opacity:.7}
#chnum{font-size:64px;font-weight:900;line-height:1;letter-spacing:2px}
#status{flex:1;text-align:right;font-size:14px;font-weight:700;line-height:1.5;color:var(--lcdtx)}
#status.ok{color:var(--lcdok)}
#status.err{color:var(--lcderr)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;border-radius:14px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
#grid button{aspect-ratio:1.15;font-size:18px;font-weight:800;border:none;border-radius:10px;color:var(--keytx);background:linear-gradient(var(--key1),var(--key2));box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.18)}
#grid button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
#grid button.on{background:linear-gradient(var(--keyon1),var(--keyon2));color:var(--keyontx)}
#pttwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:190px}
#bezel{padding:14px;border-radius:50%;background:var(--well);box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}
#ptt{display:block;width:min(52vw,200px);aspect-ratio:1;border:none;border-radius:50%;font-size:22px;font-weight:900;letter-spacing:2px;color:var(--pttx);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:radial-gradient(circle at 35% 30%,var(--ptt1),var(--ptt2) 60%,var(--ptt3));box-shadow:0 8px 0 var(--pttsh),0 14px 22px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.4)}
#ptt:disabled{color:var(--offtx);background:radial-gradient(circle at 35% 30%,var(--off1),var(--off2));box-shadow:0 8px 0 var(--offsh),0 14px 22px rgba(0,0,0,.5)}
#ptt.talk{color:var(--talktx);transform:translateY(6px);background:radial-gradient(circle at 35% 30%,var(--talk1),var(--talk2) 60%,var(--talk3));box-shadow:0 2px 0 var(--talksh),0 0 0 8px var(--talkring)}
#modes{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--well);box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
#modes button{flex:1;padding:10px 0;font-size:14px;font-weight:700;border:none;border-radius:9px;background:transparent;color:var(--modetx)}
#modes button.on{color:var(--modeon);background:linear-gradient(var(--key1),var(--key2));box-shadow:0 2px 0 var(--edge)}
#tip{font-size:12px;line-height:1.7;text-align:center;color:var(--tip)}
#keep,#sinks{display:none}
#skinpanel{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
#skinsheet{width:100%;max-width:420px;max-height:82vh;overflow:auto;padding:16px 16px 24px;border-radius:20px 20px 0 0;background:#1c1f24;color:#eee}
#skinhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:16px;font-weight:800}
#skinclose{border:none;border-radius:50%;width:32px;height:32px;font-size:16px;color:#ddd;background:#2c3036}
#skinlist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skincard{border:2px solid #2c3036;border-radius:14px;padding:8px;background:#23272d;color:#eee;font-size:14px;font-weight:700;text-align:center}
.skincard.on{border-color:#ffb94d}
.skincard span{display:block;margin-top:6px}
.mini{position:relative;height:92px;border-radius:12px;border:2px solid var(--edge);background:linear-gradient(160deg,var(--body1),var(--body2) 60%,var(--body3))}
.mini i{position:absolute;display:block}
.m-lcd{left:10px;right:10px;top:12px;height:20px;border-radius:5px;background:linear-gradient(var(--lcd1),var(--lcd2))}
.m-keys{left:10px;right:10px;top:40px;height:12px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--key1) 0 14px,transparent 14px 18px)}
.m-ptt{bottom:8px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ptt1),var(--ptt2) 60%,var(--ptt3))}
:root{--heart:polygon(50.0% 23.9%,50.0% 23.2%,50.4% 21.3%,51.2% 18.3%,52.8% 14.5%,55.2% 10.5%,58.6% 6.6%,62.8% 3.4%,67.7% 1.1%,73.1% 0.0%,78.7% 0.4%,84.3% 2.2%,89.4% 5.4%,93.8% 9.7%,97.2% 15.0%,99.3% 21.0%,100.0% 27.4%,99.3% 33.8%,97.2% 40.3%,93.8% 46.5%,89.4% 52.6%,84.3% 58.3%,78.7% 63.9%,73.1% 69.3%,67.7% 74.4%,62.8% 79.4%,58.6% 84.1%,55.2% 88.5%,52.8% 92.3%,51.2% 95.5%,50.4% 98.0%,50.0% 99.5%,50.0% 100.0%,50.0% 99.5%,49.6% 98.0%,48.8% 95.5%,47.2% 92.3%,44.8% 88.5%,41.4% 84.1%,37.2% 79.4%,32.3% 74.4%,26.9% 69.3%,21.3% 63.9%,15.7% 58.3%,10.6% 52.6%,6.2% 46.5%,2.8% 40.3%,0.7% 33.8%,0.0% 27.4%,0.7% 21.0%,2.8% 15.0%,6.2% 9.7%,10.6% 5.4%,15.7% 2.2%,21.3% 0.4%,26.9% 0.0%,32.3% 1.1%,37.2% 3.4%,41.4% 6.6%,44.8% 10.5%,47.2% 14.5%,48.8% 18.3%,49.6% 21.3%,50.0% 23.2%)}
/* ===== 造型 1：磚頭大哥大 ===== */
[data-theme="brick"] #app{max-width:400px}
[data-theme="brick"] #body{border-radius:12px 12px 24px 24px;border-width:3px;padding:18px 16px 20px;gap:10px}
[data-theme="brick"] #antenna{left:auto;right:40px;width:38px;height:62px;border-radius:7px 7px 2px 2px;background:repeating-linear-gradient(0deg,var(--ant1) 0 3px,var(--ant2) 3px 7px)}
[data-theme="brick"] #speaker{height:34px;border-radius:4px;background:repeating-linear-gradient(0deg,var(--grille-a) 0 2px,var(--grille-b) 2px 6px)}
[data-theme="brick"] #lcd{border-radius:4px;padding:6px 12px}
[data-theme="brick"] #chnum{font-size:46px}
[data-theme="brick"] #grid{border-radius:6px}
[data-theme="brick"] #grid button{border-radius:4px;aspect-ratio:1.5}
[data-theme="brick"] #pttwrap{min-height:150px}
[data-theme="brick"] #bezel{width:100%;padding:8px;border-radius:12px}
[data-theme="brick"] #ptt{position:relative;width:100%;aspect-ratio:auto;height:130px;border-radius:8px}
[data-theme="brick"] #ptt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 3px,transparent 3px 9px);pointer-events:none}
[data-theme="brick"] #modes{border-radius:6px}
[data-theme="brick"] #modes button{border-radius:4px}
/* ===== 造型 2：專業警用機 ===== */
[data-theme="pro"] #app{max-width:350px}
[data-theme="pro"] #body{border-radius:22px 22px 34px 34px;padding-top:22px}
[data-theme="pro"] #antenna{left:auto;right:56px;width:18px;height:84px;border-radius:9px 9px 3px 3px}
[data-theme="pro"] #app::before{content:"";position:absolute;top:26px;left:30px;width:48px;height:34px;border-radius:10px 10px 3px 3px;background:repeating-linear-gradient(90deg,var(--ant2) 0 3px,var(--ant1) 3px 6px);box-shadow:0 2px 6px rgba(0,0,0,.6)}
[data-theme="pro"] #top{order:0}
[data-theme="pro"] #lcd{order:1;border-radius:10px}
[data-theme="pro"] #speaker{order:2;height:76px;border-radius:14px;background:radial-gradient(circle,var(--grille-a) 2.4px,transparent 3px) 0 0/11px 11px,var(--grille-b)}
[data-theme="pro"] #grid{order:3}
[data-theme="pro"] #grid button{border-radius:8px;aspect-ratio:1.3}
[data-theme="pro"] #pttwrap{order:4;min-height:130px}
[data-theme="pro"] #modes{order:5}
[data-theme="pro"] #tip{order:6}
[data-theme="pro"] #bezel{width:100%;padding:10px;border-radius:60px}
[data-theme="pro"] #ptt{position:relative;width:100%;aspect-ratio:auto;height:96px;border-radius:48px}
[data-theme="pro"] #ptt::after{content:"";position:absolute;inset:10px 22px;border-radius:inherit;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 3px,transparent 3px 10px);pointer-events:none}
/* ===== 造型 3：可愛蛋形 ===== */
[data-theme="egg"] #antenna{display:none}
[data-theme="egg"] #app{padding-top:90px}
[data-theme="egg"] #body{position:relative;z-index:1;border-radius:44% 44% 42% 42%/26% 26% 22% 22%;padding:46px 40px 58px;border-width:3px}
[data-theme="egg"] #app::before,[data-theme="egg"] #app::after{content:"";position:absolute;top:8px;width:56px;height:110px;border-radius:50% 50% 45% 45%;z-index:0;border:2px solid var(--edge);background:radial-gradient(ellipse at 50% 62%,var(--keyon1) 0 34%,transparent 36%),linear-gradient(var(--body1),var(--body2))}
[data-theme="egg"] #app::before{left:84px;transform:rotate(-12deg)}
[data-theme="egg"] #app::after{right:84px;transform:rotate(12deg)}
[data-theme="egg"] #top{padding:0}
[data-theme="egg"] #speaker{align-self:center;width:58%;height:30px;border-radius:15px}
[data-theme="egg"] #lcd{border-radius:26px;padding:8px 22px}
[data-theme="egg"] #chnum{font-size:54px}
[data-theme="egg"] #grid{border-radius:22px;padding:12px;gap:6px}
[data-theme="egg"] #grid button{border-radius:50%;aspect-ratio:1}
[data-theme="egg"] #bezel{padding:0;background:none;box-shadow:none;filter:drop-shadow(0 7px 0 var(--pttsh)) drop-shadow(0 12px 10px rgba(0,0,0,.3))}
[data-theme="egg"] #bezel:has(#ptt.talk){filter:drop-shadow(0 0 16px var(--talkring))}
[data-theme="egg"] #ptt{width:min(56vw,210px);aspect-ratio:1.08;clip-path:var(--heart);border-radius:0;padding-top:10%;box-shadow:none}
[data-theme="egg"] #modes{border-radius:20px}
[data-theme="egg"] #modes button{border-radius:16px}
[data-theme="egg"] #tip{font-size:11px}
/* ===== 造型 4：復古收音機 ===== */
[data-theme="radio"] #antenna{left:auto;right:70px;top:2px;width:6px;height:86px;border-radius:3px;transform:rotate(14deg);transform-origin:50% 100%;background:linear-gradient(90deg,var(--ant1),var(--ant2),var(--ant1))}
[data-theme="radio"] #body{border-width:6px;border-radius:24px 24px 36px 36px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 2px,transparent 2px 9px),linear-gradient(160deg,var(--body1),var(--body2) 55%,var(--body3))}
[data-theme="radio"] #speaker{order:1;align-self:center;width:150px;height:150px;border-radius:50%;border:6px solid var(--ant2);background:repeating-radial-gradient(circle,var(--grille-a) 0 3px,var(--grille-b) 3px 6px);box-shadow:inset 0 4px 12px rgba(0,0,0,.8),0 3px 0 var(--edge)}
[data-theme="radio"] #top{order:0}
[data-theme="radio"] #lcd{order:2;border-radius:8px;border-color:var(--ant2)}
[data-theme="radio"] #grid{order:3;gap:6px}
[data-theme="radio"] #grid button{border-radius:50%;aspect-ratio:1}
[data-theme="radio"] #pttwrap{order:4;min-height:170px}
[data-theme="radio"] #bezel{padding:10px;background:conic-gradient(var(--ant2),var(--ant1),var(--ant2),var(--ant1),var(--ant2))}
[data-theme="radio"] #ptt{width:min(44vw,170px)}
[data-theme="radio"] #modes{order:5}
[data-theme="radio"] #tip{order:6}
/* ===== 造型 5：太空未來 ===== */
[data-theme="space"] #antenna{left:50%;margin-left:-3px;top:4px;width:6px;height:62px;border-radius:3px;background:linear-gradient(var(--brand),transparent);box-shadow:0 0 10px var(--brand)}
[data-theme="space"] #app::before{content:"";position:absolute;z-index:0;top:53px;bottom:13px;left:11px;right:11px;clip-path:polygon(0 29px,29px 0,calc(100% - 29px) 0,100% 29px,100% calc(100% - 29px),calc(100% - 29px) 100%,29px 100%,0 calc(100% - 29px));background:linear-gradient(160deg,var(--brand),var(--keyon1) 50%,var(--brand))}
[data-theme="space"] #body{position:relative;z-index:1;border:none;border-radius:0;clip-path:polygon(0 26px,26px 0,calc(100% - 26px) 0,100% 26px,100% calc(100% - 26px),calc(100% - 26px) 100%,26px 100%,0 calc(100% - 26px));box-shadow:none;padding:20px 20px 24px}
[data-theme="space"] #speaker{height:22px;border-radius:0;box-shadow:none;background:repeating-linear-gradient(90deg,var(--brand) 0 2px,transparent 2px 7px),var(--well)}
[data-theme="space"] #lcd{border:none;border-radius:0;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);padding:10px 18px}
[data-theme="space"] #grid{border-radius:0;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
[data-theme="space"] #grid button{border-radius:0;clip-path:polygon(0 8px,8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);box-shadow:none}
[data-theme="space"] #bezel{padding:0;background:none;box-shadow:none;filter:drop-shadow(0 0 12px var(--ptt2))}
[data-theme="space"] #bezel:has(#ptt.talk){filter:drop-shadow(0 0 16px var(--talkring))}
[data-theme="space"] #ptt{width:min(58vw,220px);aspect-ratio:1.12;border-radius:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);box-shadow:none}
[data-theme="space"] #modes{border-radius:0;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
[data-theme="space"] #modes button{border-radius:0}
/* ===== 面板選擇畫面裡的小預覽 ===== */
.mini[data-theme="brick"]{border-radius:6px}
.mini[data-theme="brick"] .m-lcd{height:12px;right:46%;border-radius:2px}
.mini[data-theme="brick"] .m-keys{border-radius:1px}
.mini[data-theme="brick"] .m-ptt{width:64px;height:20px;margin-left:-32px;border-radius:4px;bottom:10px}
.mini[data-theme="pro"]{border-radius:18px}
.mini[data-theme="pro"] .m-lcd{height:26px}
.mini[data-theme="pro"] .m-ptt{width:70px;height:18px;margin-left:-35px;border-radius:9px;bottom:10px}
.mini[data-theme="egg"]{border-radius:46% 46% 42% 42%/34% 34% 40% 40%}
.mini[data-theme="egg"] .m-lcd{left:18px;right:18px;border-radius:10px}
.mini[data-theme="egg"] .m-keys{left:18px;right:18px}
.mini[data-theme="egg"] .m-ptt{clip-path:var(--heart);border-radius:0;width:30px;height:28px;margin-left:-15px}
.mini[data-theme="radio"]{border-radius:8px;border-width:4px}
.mini[data-theme="radio"] .m-lcd{left:50%;right:auto;width:34px;height:34px;margin-left:-17px;top:8px;border-radius:50%}
.mini[data-theme="radio"] .m-keys{top:48px;background:radial-gradient(circle,var(--key1) 4px,transparent 4.5px) 0 0/16px 12px}
.mini[data-theme="radio"] .m-ptt{width:22px;height:22px;margin-left:-11px;bottom:8px}
.mini[data-theme="space"]{border:none;border-radius:0;clip-path:polygon(0 12px,12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px))}
.mini[data-theme="space"] .m-lcd{border-radius:0}
.mini[data-theme="space"] .m-ptt{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);border-radius:0;width:32px;height:28px;margin-left:-16px}
</style>
</head>
<body>
<div id="app">
  <div id="antenna"></div>
  <div id="body">
    <div id="top"><span id="brand">對講機</span><button id="skinbtn" type="button">🎨 換面板</button><span id="txled"></span></div>
    <div id="speaker"></div>
    <div id="lcd">
      <div><div class="lbl">頻道 CH</div><div id="chnum">--</div></div>
      <div id="status">請選擇頻道</div>
    </div>
    <div id="grid"></div>
    <div id="pttwrap"><div id="bezel"><button id="ptt" disabled>請先選頻道</button></div></div>
    <div id="modes">
      <button data-m="hold" class="on">按住說話</button>
      <button data-m="toggle">點一下開／關</button>
    </div>
    <div id="tip">用藍牙耳機：按「播放／暫停」鍵＝開始／停止說話<br>建議全程戴耳機，避免回音</div>
  </div>
  <div id="skinpanel" hidden>
    <div id="skinsheet">
      <div id="skinhead"><span>選擇面板</span><button id="skinclose" type="button">✕</button></div>
      <div id="skinlist"></div>
    </div>
  </div>
  <audio id="keep" playsinline></audio>
  <div id="sinks"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'zhuai-walkie-';
const pad = n => String(n).padStart(2, '0');

let myStream = null, peer = null, curCh = null, session = 0;
let talking = false, mode = 'hold', wakeLock = null;
let calls = {}, audios = {}, members = {};

/* ---------- 畫面 ---------- */
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = cls || ''; }
function liveCalls() {
  return Object.keys(calls).filter(id => {
    const pc = calls[id].peerConnection;
    const st = pc && pc.iceConnectionState;
    return !st || st === 'new' || st === 'checking' || st === 'connected' || st === 'completed';
  });
}
function peerCount() { return liveCalls().length + 1; }
function refreshStatus() { if (curCh) setStatus('已連線：頻道 ' + pad(curCh) + '　目前 ' + peerCount() + ' 人', 'ok'); }
function refreshPttLabel() {
  const b = $('ptt');
  if (!curCh) { b.textContent = '請先選頻道'; return; }
  b.textContent = talking ? '說話中…' : (mode === 'hold' ? '按住說話' : '點一下說話');
}

const grid = $('grid');
for (let i = 1; i <= 10; i++) {
  const b = document.createElement('button');
  b.textContent = pad(i);
  b.onclick = () => joinChannel(i);
  grid.appendChild(b);
}
function markChannel() {
  [...grid.children].forEach((b, i) => b.classList.toggle('on', curCh === i + 1));
  $('chnum').textContent = curCh ? pad(curCh) : '--';
}

document.querySelectorAll('#modes button').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    setTalking(false);
  };
});

/* ---------- 發話 ---------- */
function setTalking(on) {
  talking = on && !!curCh;
  if (myStream) myStream.getAudioTracks().forEach(t => t.enabled = talking);
  $('ptt').classList.toggle('talk', talking);
  refreshPttLabel();
}
const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!curCh) return;
  try { ptt.setPointerCapture(e.pointerId); } catch (_) {}
  if (mode === 'hold') setTalking(true); else setTalking(!talking);
});
['pointerup', 'pointercancel'].forEach(ev => ptt.addEventListener(ev, () => { if (mode === 'hold') setTalking(false); }));
ptt.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 藍牙耳機按鍵（媒體鍵） ---------- */
function makeSilentWav() {
  const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function setupMediaKeys() {
  const a = $('keep');
  if (!a.src) { a.src = makeSilentWav(); a.loop = true; a.volume = 0.01; }
  a.play().catch(() => {});
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: '對講機 頻道 ' + pad(curCh), artist: '按播放／暫停鍵＝說話開關' });
    const toggle = () => { setTalking(!talking); a.play().catch(() => {}); navigator.mediaSession.playbackState = 'playing'; };
    navigator.mediaSession.setActionHandler('play', toggle);
    navigator.mediaSession.setActionHandler('pause', toggle);
    navigator.mediaSession.playbackState = 'playing';
  } catch (_) {}
}

/* ---------- 連線 ---------- */
function playStream(id, stream) {
  let a = audios[id];
  if (!a) {
    a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true;
    $('sinks').appendChild(a);
    audios[id] = a;
  }
  a.srcObject = stream;
  a.play().catch(() => {});
}
function removePeer(id) {
  delete calls[id];
  if (audios[id]) { audios[id].srcObject = null; audios[id].remove(); delete audios[id]; }
  refreshStatus();
}
function attachCall(call) {
  calls[call.peer] = call;
  call.on('stream', s => { playStream(call.peer, s); refreshStatus(); });
  call.on('close', () => removePeer(call.peer));
  call.on('error', () => removePeer(call.peer));
}
function callPeer(id) {
  if (!peer || id === peer.id || calls[id]) return;
  attachCall(peer.call(id, myStream));
}

function destroyPeer() {
  Object.keys(calls).forEach(id => { try { calls[id].close(); } catch (_) {} removePeer(id); });
  members = {};
  if (peer) { try { peer.destroy(); } catch (_) {} peer = null; }
}

function rejoin(s) {
  if (s !== session || !curCh) return;
  const ch = curCh;
  destroyPeer();
  setStatus('重新連線中…');
  const ns = ++session;
  setTimeout(() => { if (ns === session && curCh === ch) start(ch, ns); }, 400 + Math.random() * 1400);
}

function start(ch, s) {
  if (typeof Peer === 'undefined') { setStatus('無法載入連線元件，請確認網路', 'err'); return; }
  const hubId = PREFIX + pad(ch) + '-hub';
  setStatus('連線中…');
  // 先試著當房主；如果頻道已經有人，就改當成員
  const p = new Peer(hubId);
  peer = p;
  p.on('open', () => {
    if (s !== session) return;
    p.on('connection', conn => {
      conn.on('open', () => {
        conn.send({ t: 'peers', list: [p.id, ...Object.keys(members)] });
        members[conn.peer] = conn;
      });
      conn.on('close', () => { delete members[conn.peer]; removePeer(conn.peer); });
    });
    refreshStatus();
  });
  p.on('call', call => { call.answer(myStream); attachCall(call); });
  p.on('error', e => {
    if (s !== session) return;
    if (e.type === 'unavailable-id') { p.destroy(); startMember(ch, s); }
    else if (e.type === 'peer-unavailable') rejoin(s);
    else if (e.type === 'browser-incompatible') setStatus('這個瀏覽器不支援', 'err');
    else { setStatus('網路不穩，重新連線中…', 'err'); rejoin(s); }
  });
  p.on('disconnected', () => { if (s === session) { try { p.reconnect(); } catch (_) {} } });
}

function startMember(ch, s) {
  const hubId = PREFIX + pad(ch) + '-hub';
  const p = new Peer();
  peer = p;
  p.on('open', () => {
    if (s !== session) return;
    const conn = p.connect(hubId, { reliable: true });
    conn.on('data', m => { if (m && m.t === 'peers') m.list.forEach(callPeer); refreshStatus(); });
    conn.on('close', () => rejoin(s));
    refreshStatus();
  });
  p.on('call', call => { call.answer(myStream); attachCall(call); });
  p.on('error', e => {
    if (s !== session) return;
    if (e.type === 'browser-incompatible') setStatus('這個瀏覽器不支援', 'err');
    else { setStatus('網路不穩，重新連線中…', 'err'); rejoin(s); }
  });
  p.on('disconnected', () => { if (s === session) { try { p.reconnect(); } catch (_) {} } });
}

async function joinChannel(ch) {
  if (curCh === ch) return;
  if (!myStream) {
    try {
      myStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      setStatus('無法使用麥克風，請允許權限（網址要是 https）', 'err');
      return;
    }
  }
  myStream.getAudioTracks().forEach(t => t.enabled = false);
  setTalking(false);
  destroyPeer();
  curCh = ch;
  const s = ++session;
  markChannel();
  $('ptt').disabled = false;
  refreshPttLabel();
  setupMediaKeys();
  requestWake();
  start(ch, s);
}

// 定時清掉已經斷掉的人，並更新人數
setInterval(() => {
  Object.keys(calls).forEach(id => {
    const pc = calls[id].peerConnection;
    const st = pc && pc.iceConnectionState;
    if (st === 'failed' || st === 'closed') removePeer(id);
  });
  refreshStatus();
}, 2000);
// 離開或重新整理頁面時，主動斷線，讓別人馬上知道
window.addEventListener('pagehide', () => { try { destroyPeer(); } catch (_) {} });

async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && curCh) requestWake(); });

// 換面板：選擇後記住，下次打開還是這一款
const SKINS = [['classic', '經典手持'], ['brick', '磚頭大哥大'], ['pro', '專業警用機'], ['egg', '可愛蛋形'], ['radio', '復古收音機'], ['space', '太空未來']];
const SKIN_OLD = { army: 'classic', police: 'pro', cute: 'egg', retro: 'brick', neon: 'space' };
const SKIN_KEY = 'walkie-skin';
function applySkin(id) {
  if (SKIN_OLD[id]) id = SKIN_OLD[id];
  if (!SKINS.some(s => s[0] === id)) id = 'classic';
  document.body.dataset.theme = id;
  try { localStorage.setItem(SKIN_KEY, id); } catch (_) {}
  const c = getComputedStyle(document.body).getPropertyValue('--body2').trim();
  const m = document.querySelector('meta[name=theme-color]');
  if (m && c) m.setAttribute('content', c);
  document.querySelectorAll('.skincard').forEach(b => b.classList.toggle('on', b.dataset.skin === id));
}
SKINS.forEach(([id, name]) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'skincard'; b.dataset.skin = id;
  b.innerHTML = '<div class="mini" data-theme="' + id + '"><i class="m-lcd"></i><i class="m-keys"></i><i class="m-ptt"></i></div><span>' + name + '</span>';
  b.onclick = () => { applySkin(id); $('skinpanel').hidden = true; };
  $('skinlist').appendChild(b);
});
$('skinbtn').onclick = () => { $('skinpanel').hidden = false; };
$('skinclose').onclick = () => { $('skinpanel').hidden = true; };
$('skinpanel').addEventListener('click', e => { if (e.target === $('skinpanel')) $('skinpanel').hidden = true; });
let savedSkin = 'classic';
try { savedSkin = localStorage.getItem(SKIN_KEY) || 'classic'; } catch (_) {}
applySkin(savedSkin);

// App 安裝與自動更新：每次開啟都先抓最新版
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController) { hadController = true; return; }
    if (!curCh) location.reload();   // 沒在頻道裡才自動重新載入，避免打斷通話
  });
}
</script>
</body>
</html>
