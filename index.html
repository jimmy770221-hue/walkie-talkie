<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>對講機</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:#e8e8e8;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% 0%,#2c3036,#111316 70%)}
#app{width:100%;max-width:380px;min-height:100vh;min-height:100dvh;padding:56px 14px 16px;position:relative;display:flex;flex-direction:column}
#antenna{position:absolute;top:6px;left:44px;width:24px;height:70px;border-radius:12px 12px 4px 4px;background:linear-gradient(90deg,#0b0c0e,#30343a 45%,#0b0c0e);box-shadow:0 2px 6px rgba(0,0,0,.6)}
#body{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 14px 18px;border-radius:34px 34px 46px 46px;background:linear-gradient(160deg,#3d4148,#25282d 55%,#1a1c20);border:2px solid #0b0c0e;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 18px 40px rgba(0,0,0,.65)}
#top{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
#brand{font-size:14px;letter-spacing:6px;color:#f4a62a;font-weight:800}
#txled{width:14px;height:14px;border-radius:50%;background:#3d1c1c;box-shadow:inset 0 0 3px #000}
body:has(#ptt.talk) #txled{background:#ff3b30;box-shadow:0 0 12px 3px #ff3b30}
#speaker{height:48px;border-radius:12px;background:repeating-linear-gradient(90deg,#0a0b0d 0 6px,#30343a 6px 9px);box-shadow:inset 0 3px 8px rgba(0,0,0,.85)}
#lcd{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:12px;border:3px solid #0b0c0e;background:linear-gradient(#bcd48a,#9fba6c);color:#1d2a0f;font-family:"Courier New",monospace;box-shadow:inset 0 0 14px rgba(0,0,0,.35)}
#lcd .lbl{font-size:12px;font-weight:700;opacity:.7}
#chnum{font-size:64px;font-weight:900;line-height:1;letter-spacing:2px}
#status{flex:1;text-align:right;font-size:14px;font-weight:700;line-height:1.5;color:#1d2a0f}
#status.ok{color:#17450a}
#status.err{color:#8a1b12}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;border-radius:14px;background:#14161a;box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
#grid button{aspect-ratio:1.15;font-size:18px;font-weight:800;border:none;border-radius:10px;color:#ececec;background:linear-gradient(#4b5058,#32363c);box-shadow:0 3px 0 #0b0c0e,inset 0 1px 0 rgba(255,255,255,.18)}
#grid button:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0c0e}
#grid button.on{background:linear-gradient(#ffb94d,#f08a00);color:#2a1700}
#pttwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:190px}
#bezel{padding:14px;border-radius:50%;background:#14161a;box-shadow:inset 0 3px 8px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}
#ptt{display:block;width:min(52vw,200px);aspect-ratio:1;border:none;border-radius:50%;font-size:22px;font-weight:900;letter-spacing:2px;color:#2a1700;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:radial-gradient(circle at 35% 30%,#ffc766,#f08a00 60%,#b85f00);box-shadow:0 8px 0 #7a3f00,0 14px 22px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.4)}
#ptt:disabled{color:#a0a3aa;background:radial-gradient(circle at 35% 30%,#5d6067,#3a3d43);box-shadow:0 8px 0 #1c1e22,0 14px 22px rgba(0,0,0,.5)}
#ptt.talk{color:#fff;transform:translateY(6px);background:radial-gradient(circle at 35% 30%,#ff7d73,#e5322b 60%,#a3150f);box-shadow:0 2px 0 #5c0b07,0 0 0 8px rgba(255,59,48,.3)}
#modes{display:flex;gap:4px;padding:4px;border-radius:12px;background:#14161a;box-shadow:inset 0 2px 6px rgba(0,0,0,.75)}
#modes button{flex:1;padding:10px 0;font-size:14px;font-weight:700;border:none;border-radius:9px;background:transparent;color:#8d9199}
#modes button.on{color:#ffb94d;background:linear-gradient(#4b5058,#32363c);box-shadow:0 2px 0 #0b0c0e}
#tip{font-size:12px;line-height:1.7;text-align:center;color:#7f848d}
#keep,#sinks{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="antenna"></div>
  <div id="body">
    <div id="top"><span id="brand">對講機</span><span id="txled"></span></div>
    <div id="speaker"></div>
    <div id="lcd">
      <div><div class="lbl">頻道 CH</div><div id="chnum">--</div></div>
      <div id="status">請選擇頻道</div>
    </div>
    <div id="grid"></div>
    <div id="pttwrap"><div id="bezel"><button id="ptt" disabled>請先選頻道</button></div></div>
    <div id="modes">
      <button data-m="hold" class="on">按住說話</button>
      <button data-m="toggle">點一下開／關</button>
    </div>
    <div id="tip">用藍牙耳機：按「播放／暫停」鍵＝開始／停止說話<br>建議全程戴耳機，避免回音</div>
  </div>
  <audio id="keep" playsinline></audio>
  <div id="sinks"></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'zhuai-walkie-';
const pad = n => String(n).padStart(2, '0');

let myStream = null, peer = null, curCh = null, session = 0;
let talking = false, mode = 'hold', wakeLock = null;
let calls = {}, audios = {}, members = {};

/* ---------- 畫面 ---------- */
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = cls || ''; }
function peerCount() { return Object.keys(calls).length + 1; }
function refreshStatus() { if (curCh) setStatus('已連線：頻道 ' + pad(curCh) + '　目前 ' + peerCount() + ' 人', 'ok'); }
function refreshPttLabel() {
  const b = $('ptt');
  if (!curCh) { b.textContent = '請先選頻道'; return; }
  b.textContent = talking ? '說話中…' : (mode === 'hold' ? '按住說話' : '點一下說話');
}

const grid = $('grid');
for (let i = 1; i <= 10; i++) {
  const b = document.createElement('button');
  b.textContent = pad(i);
  b.onclick = () => joinChannel(i);
  grid.appendChild(b);
}
function markChannel() {
  [...grid.children].forEach((b, i) => b.classList.toggle('on', curCh === i + 1));
  $('chnum').textContent = curCh ? pad(curCh) : '--';
}

document.querySelectorAll('#modes button').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.m;
    document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    setTalking(false);
  };
});

/* ---------- 發話 ---------- */
function setTalking(on) {
  talking = on && !!curCh;
  if (myStream) myStream.getAudioTracks().forEach(t => t.enabled = talking);
  $('ptt').classList.toggle('talk', talking);
  refreshPttLabel();
}
const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!curCh) return;
  try { ptt.setPointerCapture(e.pointerId); } catch (_) {}
  if (mode === 'hold') setTalking(true); else setTalking(!talking);
});
['pointerup', 'pointercancel'].forEach(ev => ptt.addEventListener(ev, () => { if (mode === 'hold') setTalking(false); }));
ptt.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 藍牙耳機按鍵（媒體鍵） ---------- */
function makeSilentWav() {
  const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(buf, 44).fill(128);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function setupMediaKeys() {
  const a = $('keep');
  if (!a.src) { a.src = makeSilentWav(); a.loop = true; a.volume = 0.01; }
  a.play().catch(() => {});
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: '對講機 頻道 ' + pad(curCh), artist: '按播放／暫停鍵＝說話開關' });
    const toggle = () => { setTalking(!talking); a.play().catch(() => {}); navigator.mediaSession.playbackState = 'playing'; };
    navigator.mediaSession.setActionHandler('play', toggle);
    navigator.mediaSession.setActionHandler('pause', toggle);
    navigator.mediaSession.playbackState = 'playing';
  } catch (_) {}
}

/* ---------- 連線 ---------- */
function playStream(id, stream) {
  let a = audios[id];
  if (!a) {
    a = document.createElement('audio');
    a.autoplay = true; a.playsInline = true;
    $('sinks').appendChild(a);
    audios[id] = a;
  }
  a.srcObject = stream;
  a.play().catch(() => {});
}
function removePeer(id) {
  delete calls[id];
  if (audios[id]) { audios[id].srcObject = null; audios[id].remove(); delete audios[id]; }
  refreshStatus();
}
function attachCall(call) {
  calls[call.peer] = call;
  call.on('stream', s => { playStream(call.peer, s); refreshStatus(); });
  call.on('close', () => removePeer(call.peer));
  call.on('error', () => removePeer(call.peer));
}
function callPeer(id) {
  if (!peer || id === peer.id || calls[id]) return;
  attachCall(peer.call(id, myStream));
}

function destroyPeer() {
  Object.keys(calls).forEach(id => { try { calls[id].close(); } catch (_) {} removePeer(id); });
  members = {};
  if (peer) { try { peer.destroy(); } catch (_) {} peer = null; }
}

function rejoin(s) {
  if (s !== session || !curCh) return;
  const ch = curCh;
  destroyPeer();
  setStatus('重新連線中…');
  const ns = ++session;
  setTimeout(() => { if (ns === session && curCh === ch) start(ch, ns); }, 400 + Math.random() * 1400);
}

function start(ch, s) {
  if (typeof Peer === 'undefined') { setStatus('無法載入連線元件，請確認網路', 'err'); return; }
  const hubId = PREFIX + pad(ch) + '-hub';
  setStatus('連線中…');
  // 先試著當房主；如果頻道已經有人，就改當成員
  const p = new Peer(hubId);
  peer = p;
  p.on('open', () => {
    if (s !== session) return;
    p.on('connection', conn => {
      conn.on('open', () => {
        conn.send({ t: 'peers', list: [p.id, ...Object.keys(members)] });
        members[conn.peer] = conn;
      });
      conn.on('close', () => { delete members[conn.peer]; removePeer(conn.peer); });
    });
    refreshStatus();
  });
  p.on('call', call => { call.answer(myStream); attachCall(call); });
  p.on('error', e => {
    if (s !== session) return;
    if (e.type === 'unavailable-id') { p.destroy(); startMember(ch, s); }
    else if (e.type === 'peer-unavailable') rejoin(s);
    else if (e.type === 'browser-incompatible') setStatus('這個瀏覽器不支援', 'err');
    else { setStatus('網路不穩，重新連線中…', 'err'); rejoin(s); }
  });
  p.on('disconnected', () => { if (s === session) { try { p.reconnect(); } catch (_) {} } });
}

function startMember(ch, s) {
  const hubId = PREFIX + pad(ch) + '-hub';
  const p = new Peer();
  peer = p;
  p.on('open', () => {
    if (s !== session) return;
    const conn = p.connect(hubId, { reliable: true });
    conn.on('data', m => { if (m && m.t === 'peers') m.list.forEach(callPeer); refreshStatus(); });
    conn.on('close', () => rejoin(s));
    refreshStatus();
  });
  p.on('call', call => { call.answer(myStream); attachCall(call); });
  p.on('error', e => {
    if (s !== session) return;
    if (e.type === 'browser-incompatible') setStatus('這個瀏覽器不支援', 'err');
    else { setStatus('網路不穩，重新連線中…', 'err'); rejoin(s); }
  });
  p.on('disconnected', () => { if (s === session) { try { p.reconnect(); } catch (_) {} } });
}

async function joinChannel(ch) {
  if (curCh === ch) return;
  if (!myStream) {
    try {
      myStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      setStatus('無法使用麥克風，請允許權限（網址要是 https）', 'err');
      return;
    }
  }
  myStream.getAudioTracks().forEach(t => t.enabled = false);
  setTalking(false);
  destroyPeer();
  curCh = ch;
  const s = ++session;
  markChannel();
  $('ptt').disabled = false;
  refreshPttLabel();
  setupMediaKeys();
  requestWake();
  start(ch, s);
}

async function requestWake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && curCh) requestWake(); });
</script>
</body>
</html>
